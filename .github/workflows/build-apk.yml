name: build-apk

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure host build
        run: cmake -S engine -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build engine and tests
        run: cmake --build build/host --parallel

      - name: Run host tests
        run: ctest --test-dir build/host/tests --output-on-failure

  apk:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PC_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner has the Android SDK preinstalled at ANDROID_HOME. Accept licences, then make sure the exact
      # NDK and CMake versions from android/app/build.gradle.kts are installed (no-op if already present).
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          # Install one package at a time and retry: the NDK zip download is
          # sometimes cut off ("Error on ZipFile unknown archive").
          install() {
            local pkg="$1" dir="$2"
            for attempt in 1 2 3; do
              if [ -f "$ANDROID_HOME/$dir/source.properties" ]; then return 0; fi
              rm -rf "$ANDROID_HOME/$dir"
              "$SDKMANAGER" --install "$pkg" || true
              if [ -f "$ANDROID_HOME/$dir/source.properties" ]; then return 0; fi
              echo "Install of $pkg failed (attempt $attempt), retrying"
              sleep $((attempt * 10))
            done
            echo "::error::Could not install $pkg"
            return 1
          }
          install "cmake;3.22.1" "cmake/3.22.1"
          install "ndk;27.2.12479018" "ndk/27.2.12479018"

      # Pocket Craft uses the same package name and signing key as the Pocket Client launcher, so an APK from
      # here installs as an update over it. The key is the public debug key of ZalithLauncher at a pinned commit.
      - name: Fetch shared signing key
        uses: actions/checkout@v4
        with:
          repository: ZalithLauncher/ZalithLauncher
          ref: ed8a5c873b25f19d08aef5bdfc1084fd9aff836c
          path: zl1
          sparse-checkout: ZalithLauncher/debug.keystore
          sparse-checkout-cone-mode: false

      - name: Copy shared signing key into the app module
        run: cp zl1/ZalithLauncher/debug.keystore android/app/zalith-debug.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          set -euo pipefail
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk "apk-out/pocket-craft-0.1.${GITHUB_RUN_NUMBER}.apk"
          ls -l apk-out

      # Fails the job unless the APK has the launcher's package name, the expected versionCode (1000000 + run
      # number, above the launcher's own 300000 + run number) and the signing certificate of the shared key.
      - name: Verify package, versionCode and signature
        run: |
          set -euo pipefail
          APK="apk-out/pocket-craft-0.1.${GITHUB_RUN_NUMBER}.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          BT="${BT%/}"
          echo "Using build-tools in $BT"

          # SHA-256 of the certificate in the keystore, lower-case hex without colons.
          KEYTOOL_OUT="$(keytool -list -v -keystore android/app/zalith-debug.keystore -storepass android -alias androiddebugkey)"
          KS_SHA="$(grep -m1 'SHA256:' <<<"$KEYTOOL_OUT" | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          if [ -z "$KS_SHA" ]; then
            echo "::error::Could not read the SHA-256 of the shared keystore"
            exit 1
          fi

          # SHA-256 digest of the signer certificate of the APK (apksigner also fails here if the APK is unsigned).
          APK_SIGN="$("$BT/apksigner" verify --print-certs "$APK")"
          APK_SHA="$(grep -m1 'certificate SHA-256 digest' <<<"$APK_SIGN" | awk '{print $NF}' | tr 'A-F' 'a-f')"
          echo "Keystore SHA-256: $KS_SHA"
          echo "APK signer SHA-256: $APK_SHA"
          if [ "$APK_SHA" != "$KS_SHA" ]; then
            echo "::error::APK is signed with a different certificate than the shared key; it would not install over Pocket Client"
            exit 1
          fi

          BADGING="$("$BT/aapt2" dump badging "$APK")"
          PARSED="$(sed -n "s/^package: name='\([^']*\)' versionCode='\([0-9]*\)'.*/\1 \2/p" <<<"$BADGING")"
          PKG="${PARSED% *}"
          VC="${PARSED##* }"
          echo "Package: $PKG"
          echo "versionCode: $VC"
          if [ "$PKG" != "com.movtery.zalithlauncher" ]; then
            echo "::error::Package is '$PKG', expected com.movtery.zalithlauncher"
            exit 1
          fi
          if [ "$VC" != "$((1000000 + GITHUB_RUN_NUMBER))" ]; then
            echo "::error::versionCode is $VC, expected $((1000000 + GITHUB_RUN_NUMBER))"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-craft-apk
          path: apk-out/pocket-craft-0.1.${{ github.run_number }}.apk
          if-no-files-found: error

  release:
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocket-craft-apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: Pocket Craft 0.1.${{ github.run_number }}
          body: |
            גרסה לבדיקה. להתקנה: להוריד את קובץ ה-APK ולפתוח אותו בטלפון.
          files: pocket-craft-0.1.${{ github.run_number }}.apk
          fail_on_unmatched_files: true
          make_latest: true
